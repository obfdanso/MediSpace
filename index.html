<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediSpace - AI Health Assistant</title>
    <meta name="description" content="Ask health questions in plain language and get clear answers in seconds. MediSpace explains symptoms and medicines and tells you when to see a doctor. Built in Ghana." />
    <link rel="canonical" href="https://medi-space.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MediSpace" />
    <meta property="og:title" content="MediSpace - AI Health Assistant" />
    <meta property="og:description" content="Clear health answers, any time. Understand your symptoms and medicines, and know when to see a doctor." />
    <meta property="og:url" content="https://medi-space.vercel.app/" />
    <meta property="og:image" content="https://medi-space.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MediSpace - AI Health Assistant" />
    <meta name="twitter:description" content="Clear health answers, any time. Understand your symptoms and medicines, and know when to see a doctor." />
    <meta name="twitter:image" content="https://medi-space.vercel.app/og-image.png" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before the first paint so dark devices don't flash white
      (function () {
        var t = null;
        try { t = sessionStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
